<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0306">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>汉字 · Repaso de Chino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#f3c56b; --gold-hi:#fff1cc; --gold-lo:#b8812c;
    --ink:#22030a; --hair:rgba(255,212,145,.22);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --serif:"Noto Serif","Noto Serif SC",Georgia,serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0306;color:#fff;
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(var(--safe-t) + 14px) 16px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;
    background:rgba(38,4,9,.42);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
    font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,232,195,.86);
    box-shadow:inset 0 1px 0 rgba(255,240,210,.08),0 10px 24px -12px rgba(0,0,0,.7)}
  .seal{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;letter-spacing:0;
    font-family:var(--zh);font-weight:900;font-size:14px;color:#ffe7b3;
    background:linear-gradient(145deg,#e0402f,#8a0d14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 8px rgba(120,0,0,.55)}
  #card{position:relative;width:min(520px,100%);padding:16px 22px 18px;border-radius:26px;text-align:center;overflow:hidden;
    background:linear-gradient(180deg,rgba(96,15,20,.52),rgba(34,4,8,.52));
    border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,235,200,.13),0 28px 60px -24px rgba(0,0,0,.8)}
  #card::before{content:"";position:absolute;left:18%;right:18%;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,215,140,.75),transparent)}
  #card.has-speaker{padding-left:62px;padding-right:62px}
  #card.has-speaker .title{font-size:clamp(26px,7.4vw,38px)}
  .title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.12;letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff7e2 10%,#f5cd7a 70%,#d9a04a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,170,60,.18))}
  .title.number{font-family:var(--sans);font-weight:700;font-size:clamp(58px,18vw,86px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  #card .title.long{font-size:clamp(25px,7.2vw,36px)}
  .sub{margin-top:7px;font-size:14px;font-weight:500;color:rgba(255,226,192,.72);line-height:1.35}
  #speak{position:absolute;right:10px;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;
    display:none;place-items:center;pointer-events:auto;cursor:pointer;border:1px solid rgba(255,215,140,.35);
    color:#ffe2a6;background:radial-gradient(circle at 50% 30%,rgba(255,190,90,.30),rgba(120,16,18,.35));
    box-shadow:inset 0 1px 0 rgba(255,240,210,.2),0 6px 18px -6px rgba(0,0,0,.7)}
  #card.has-speaker #speak{display:grid}
  #speak:active{transform:scale(.92)}
  #speak::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgba(255,210,130,.7);opacity:0}
  body.speaking #speak::after{animation:ring 1.1s ease-out infinite}
  body.speaking #speak .w1{animation:wave 0.9s ease-in-out infinite}
  body.speaking #speak .w2{animation:wave 0.9s .15s ease-in-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  @keyframes wave{50%{opacity:.25}}

  /* ---------- Toast (acierto) ---------- */
  #toast{position:fixed;left:50%;top:36%;z-index:6;pointer-events:none;text-align:center;opacity:0}
  #toast .t-zh{font-family:var(--zh);font-weight:900;font-size:clamp(56px,17vw,92px);line-height:1;white-space:nowrap;
    background:linear-gradient(180deg,#fffbe9,#ffd27a 55%,#e39a32);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,170,60,.6)) drop-shadow(0 4px 2px rgba(60,0,0,.6))}
  #toast .t-py{margin-top:2px;font-family:var(--serif);font-size:16px;letter-spacing:.06em;color:rgba(255,236,200,.85)}
  #toast .t-sub{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 10px;margin-top:12px;padding:8px 16px;border-radius:22px;
    max-width:calc(100vw - 32px);white-space:normal;line-height:1.3;
    background:rgba(38,4,9,.5);border:1px solid var(--hair);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    font-size:15px;color:#ffeccc}
  #toast .t-sub b{font-family:var(--zh);font-weight:900;font-size:20px;color:#ffd27a}
  #toast .t-sub i{font-style:normal;font-family:var(--serif);color:#fff}
  #toast .t-sub span{color:rgba(255,225,190,.7)}

  /* ---------- Reveal (fallo) ---------- */
  #reveal{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:7;margin:0 auto;max-width:520px;
    border-radius:30px;padding:16px 20px 18px;pointer-events:none;transform:translateY(140%);
    background:linear-gradient(180deg,rgba(70,10,14,.78),rgba(26,3,7,.86));border:1px solid rgba(255,140,110,.28);
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,220,200,.12),0 -10px 60px -20px rgba(0,0,0,.8)}
  #reveal.on{pointer-events:auto}
  .rv-head{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,190,170,.8)}
  .rv-head em{font-style:normal;letter-spacing:.02em;text-transform:none;font-weight:500;color:rgba(255,225,200,.45)}
  .rv-body{display:flex;align-items:center;gap:18px;margin-top:10px}
  .rv-char{flex:none;min-width:88px;height:88px;padding:0 14px;border-radius:22px;display:grid;place-items:center;
    font-family:var(--zh);font-weight:900;font-size:58px;line-height:1;color:#7d0f14;
    background:linear-gradient(180deg,#fbf3df,#e8dbbb);box-shadow:inset 0 -6px 0 #0d6a4c,inset 0 1px 0 #fff,0 10px 24px -10px rgba(0,0,0,.8)}
  .rv-char.long{font-size:40px}
  .rv-char.xl{font-size:26px;height:auto;min-height:88px;max-width:58%;padding:10px 14px;line-height:1.25}
  .rv-txt{min-width:0}
  .rv-py{font-family:var(--serif);font-weight:700;font-size:28px;color:#ffe2a6;line-height:1.1}
  .rv-es{margin-top:4px;font-size:16px;color:rgba(255,232,210,.78)}
  .rv-bar{margin-top:14px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .rv-bar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,#f3c56b,#ff7a4a)}

  /* ---------- Hint / loader / ripple ---------- */
  /* Insignia de altavoz pegada a la moneda (modo pinyin) */
  #coin-tag{position:fixed;left:0;top:0;z-index:4;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:0;padding:0;
    display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;color:#2a0408;
    background:linear-gradient(180deg,#ffe7ad,#e5a443);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 3px rgba(60,6,10,.55),0 8px 20px -6px rgba(0,0,0,.8)}
  #coin-tag.on{pointer-events:auto}
  #coin-tag::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,214,140,.8);animation:ring 1.6s ease-out infinite}
  #coin-tag:active{transform:scale(.92)}
  .meta{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:13px;color:rgba(255,226,192,.75);
    background:rgba(0,0,0,.18);border:1px solid rgba(255,212,145,.16)}
  .meta b{font-family:var(--zh);font-size:16px;color:#fff1d2;font-weight:700}
  .meta:empty{display:none}
  /* Burbujas de conversación */
  .chat{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
  .chat:empty{display:none}
  .bub{position:relative;max-width:86%;padding:8px 14px 9px;border-radius:18px;background:rgba(255,236,214,.09);border:1px solid rgba(255,212,145,.2)}
  .bub.a{align-self:flex-start;border-bottom-left-radius:6px}
  .bub.b{align-self:flex-end;border-bottom-right-radius:6px;background:linear-gradient(180deg,rgba(243,197,107,.26),rgba(190,110,40,.2));border-color:rgba(255,212,145,.35)}
  .bub .who{position:absolute;top:-8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,215,160,.7)}
  .bub.a .who{left:12px}.bub.b .who{right:12px}
  .bub .zh{font-family:var(--zh);font-weight:700;font-size:23px;line-height:1.3;color:#fff3d6}
  .bub .py{font-family:var(--serif);font-size:14.5px;color:#ffd99a}
  .bub .es{margin-top:2px;font-size:12.5px;color:rgba(255,226,192,.62)}
  .gap{display:inline-block;min-width:1.15em;margin:0 2px;text-align:center;border-bottom:2px solid #f3c56b;color:#f3c56b;animation:breath 1.6s ease-in-out infinite}
  .bub .wait{font-size:22px;letter-spacing:4px;color:#f3c56b;animation:breath 1.2s ease-in-out infinite}
  #hint{position:fixed;left:50%;bottom:calc(var(--safe-b) + 18px);transform:translateX(-50%);z-index:4;pointer-events:none;white-space:nowrap;
    display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;color:rgba(255,232,200,.85);
    background:rgba(38,4,9,.45);border:1px solid var(--hair);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    animation:breath 2.4s ease-in-out infinite}
  @keyframes breath{50%{opacity:.55}}
  #loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#4a0a0f,#140205 70%)}
  #loader .seal{width:76px;height:76px;border-radius:20px;font-size:44px;animation:pulse 1.4s ease-in-out infinite}
  #loader p{margin:18px 0 0;text-align:center;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,220,180,.6)}
  @keyframes pulse{50%{transform:scale(.92);filter:brightness(1.25)}}
  .ripple{position:fixed;z-index:8;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;
    border:2px solid rgba(255,214,140,.9);box-shadow:0 0 14px rgba(255,180,80,.6);animation:rip .55s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rip{to{transform:scale(7);opacity:0;border-width:.5px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<header id="hud">
  <div id="chip" class="chip"><span id="seal" class="seal">字</span><span id="chip-text">Cargando</span></div>
  <div id="card">
    <div id="card-in"><div id="title" class="title">&nbsp;</div><div id="sub" class="sub">&nbsp;</div><div id="meta" class="meta"></div><div id="chat" class="chat"></div></div>
    <button id="speak" aria-label="Escuchar otra vez">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6.5 9H3.5v6h3l4.5 4V5z" fill="currentColor" stroke="none"/>
        <path class="w1" d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4"/><path class="w2" d="M18.4 5.9a8.8 8.8 0 0 1 0 12.2"/>
      </svg>
    </button>
  </div>
</header>

<div id="toast"><div class="t-zh" id="t-zh">对！</div><div class="t-py" id="t-py">duì</div><div class="t-sub" id="t-sub"></div></div>

<div id="reveal">
  <div class="rv-head"><span>La respuesta era</span><em>toca para seguir</em></div>
  <div class="rv-body">
    <div class="rv-char" id="rv-char">马</div>
    <div class="rv-txt"><div class="rv-py" id="rv-py">mǎ</div><div class="rv-es" id="rv-es">Caballo</div></div>
  </div>
  <div class="rv-bar"><i id="rv-bar"></i></div>
</div>

<button id="coin-tag" aria-label="Escuchar el carácter"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11 5 6.5 9H3.5v6h3l4.5 4V5z"/><path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4M18.4 5.9a8.8 8.8 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
<div id="hint">🔊 Toca la pantalla para activar el sonido</div>
<div id="loader"><div><div class="seal">汉</div><p>加载中</p></div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const gsap = window.gsap;

/* =====================================================================
   VOCABULARIO
   ===================================================================== */
const VOCAB = [
  { espanol: "Uno", chino: "一", pinyin: "yī" }, { espanol: "Dos", chino: "二", pinyin: "èr" },
  { espanol: "Tres", chino: "三", pinyin: "sān" }, { espanol: "Cuatro", chino: "四", pinyin: "sì" },
  { espanol: "Cinco", chino: "五", pinyin: "wǔ" }, { espanol: "Seis", chino: "六", pinyin: "liù" },
  { espanol: "Siete", chino: "七", pinyin: "qī" }, { espanol: "Ocho", chino: "八", pinyin: "bā" },
  { espanol: "Nueve", chino: "九", pinyin: "jiǔ" }, { espanol: "Diez", chino: "十", pinyin: "shí" },
  { espanol: "Fuerza", chino: "力", pinyin: "lì" }, { espanol: "Puerta", chino: "门", pinyin: "mén" },
  { espanol: "También", chino: "也", pinyin: "yě" }, { espanol: "Caballo", chino: "马", pinyin: "mǎ" },
  { espanol: "Madera", chino: "木", pinyin: "mù" }, { espanol: "Bosque", chino: "林", pinyin: "lín" },
  { espanol: "Mujer", chino: "女", pinyin: "nǚ" }, { espanol: "Fuego", chino: "火", pinyin: "huǒ" },
  { espanol: "Persona", chino: "人", pinyin: "rén" }
];
const NUMS = VOCAB.slice(0, 10);
// Caracteres que se confunden a simple vista: distractores más interesantes
const CONFUSABLE = { '木':['林','火','人'], '林':['木'], '人':['八','火','力'], '八':['人','六'], '力':['九','也'],
  '九':['力'], '女':['也','马'], '一':['二','三'], '二':['三','一'], '三':['二','一'], '十':['七'], '七':['十'], '火':['人','木'] };
// Frases de conversación, como tokens [carácter, pinyin] para poder dejar huecos
const T = (c, p) => ({ c, p });
const PHRASES = {
  nihao: { t: [T('你','Nǐ'), T('好','hǎo'), T('！','!')], es: '¡Hola!' },
  ma:    { t: [T('你','Nǐ'), T('好','hǎo'), T('吗','ma'), T('？','?')], es: '¿Qué tal? ¿Cómo estás?' },
  ne:    { t: [T('我','Wǒ'), T('很','hěn'), T('好','hǎo'), T('，',','), T('你','nǐ'), T('呢','ne'), T('？','?')], es: 'Estoy bien, ¿y tú?' },
  ye:    { t: [T('我','Wǒ'), T('也','yě'), T('很','hěn'), T('好','hǎo'), T('。','.')], es: 'Yo también estoy bien.' },
  bu:    { t: [T('我','Wǒ'), T('不','bù'), T('好','hǎo'), T('。','.')], es: 'No estoy bien.' },
};
const isPunct = tok => /[！？，。]/.test(tok.c);
for (const k in PHRASES) {
  const P = PHRASES[k]; P.id = k;
  P.zh = P.t.map(x => x.c).join('');
  P.py = P.t.reduce((acc, x) => isPunct(x) ? acc + x.p : (acc ? acc + ' ' : '') + x.p, '');
}
const WORDS = [['我','wǒ'],['你','nǐ'],['很','hěn'],['好','hǎo'],['吗','ma'],['呢','ne'],['也','yě'],['不','bù']].map(([c, p]) => ({ chino: c, pinyin: p }));
// Qué respuestas encajan con cada frase (y cuáles no pueden salir como distractor por ser también válidas)
const REPLIES = [
  { q: 'nihao', ok: ['nihao'], bad: ['ye', 'bu', 'ne', 'ma'] },
  { q: 'ma', ok: ['ne', 'bu'], bad: ['ma', 'ye', 'nihao'] },
  { q: 'ne', ok: ['ye', 'bu'], bad: ['ma', 'ne', 'nihao'] },
];
// Compañeros de clase: a veces la pregunta va dirigida a uno de ellos ("Lorea，你好吗？")
const NAMES = ['Manex', 'Isidro', 'Imanol', 'Lorea', 'Ekai', 'Itsaso', 'Andrea'];
function withName(P) {
  if (P.id !== 'ma' || Math.random() < .25) return P;
  const n = pick(NAMES), t = [T(n + '，', n + ','), ...P.t.map((x, i) => i === 0 ? T(x.c, x.p.toLowerCase()) : x)];
  return { ...P, t, zh: t.map(x => x.c).join(''),
    py: t.reduce((acc, x) => isPunct(x) ? acc + x.p : (acc ? acc + ' ' : '') + x.p, ''), es: `${n}, ¿qué tal?` };
}
const phraseAns = P => ({ chino: P.zh, pinyin: P.py, espanol: P.es });
function bubble(cls, who, zh, py, es) {
  return `<div class="bub ${cls}"><span class="who">${who}</span><div class="zh">${zh}</div>${py ? `<div class="py">${py}</div>` : ''}${es ? `<div class="es">${es}</div>` : ''}</div>`;
}
const PRAISE = [ {zh:'对！',py:'duì'}, {zh:'很好！',py:'hěn hǎo'}, {zh:'太棒了！',py:'tài bàng le'}, {zh:'真棒！',py:'zhēn bàng'} ];

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

const recent = [];
function pickTarget(pool) {
  let c = pool.filter(v => !recent.includes(v.chino));
  if (!c.length) c = pool;
  const t = pick(c); recent.push(t.chino); if (recent.length > 6) recent.shift();
  return t;
}
function charDistractors(target, n) {
  const out = shuffle((CONFUSABLE[target.chino] || []).map(c => VOCAB.find(v => v.chino === c))).slice(0, 2);
  for (const v of shuffle(VOCAB)) { if (out.length >= n) break; if (v !== target && !out.includes(v)) out.push(v); }
  return out;
}
// Distractores cuyo pinyin se parece (misma inicial o misma última letra): obliga a leer el pinyin entero

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: `

    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
    void main(){

      float d = length(p - vec2(0., .05));
      vec3 deep = vec3(.014,.001,.003), mid = vec3(.105,.008,.012), warm = vec3(.42,.075,.02);
      vec3 col = mix(mid, deep, smoothstep(.0, .95, d));
      col += warm * exp(-d*d*5.) * .34;
      // humo / nubes xiangyun
      float t = uTime;
      float n  = fbm(p*2.1 + vec2(t*.018, -t*.03));
      float n2 = fbm(p*3.6 + vec2(-t*.025, t*.012) + n*1.6);
      col += vec3(.3,.055,.018) * pow(n2, 2.6) * .6;
      // luna
      vec2 mp = vec2(min(.5*uAspect - .16, .42), .3);
      float md = length(p - mp);
      col += vec3(1.,.66,.34) * (smoothstep(.07,.064,md) * .42 + exp(-md*md*60.) * .14 + exp(-md*md*6.) * .04);
      // flash de acierto / fallo

      col *= 1. - smoothstep(.38, 1.15, length(p * vec2(.95, .78)));

  });
  R.update = t => tiles.forEach(x => idleFloat(x, t));
  function choose(tile) {
    if (state.locked) return; state.locked = true;
    const item = tile.userData.item; Speech.say(item.chino); sfx.tap();
    gsap.killTweensOf(tile.position); gsap.killTweensOf(tile.rotation);

      const A = area();

      tiles.filter(x => x !== tile).forEach((o, i) => {
        gsap.killTweensOf(o.position);
        gsap.to(o.position, { y: '-=8', z: -4, duration: 1, delay: i * .05, ease: 'power2.in' });

  };

  lanterns.forEach((L, i) => gsap.to(L.userData.grow, { v: 1, duration: 1.1, delay: .35 + i * .11, ease: 'back.out(1.7)' }));

      sl.position.copy(sl.userData.home); sl.scale.setScalar(ss);
      const t = sl.userData.tile; if (t && t.userData.placed) { t.position.copy(sl.userData.home); t.scale.setScalar(ss); }
    });
    keys.forEach((k, i) => {
      const c = i % 5, r = (i / 5) | 0;
      k.userData.home = new THREE.Vector3((c - 2) * (TILE.w + .16) * ks, r ? row2 : row1, 0);
      if (k.userData.entered) { k.position.copy(k.userData.home); k.scale.setScalar(ks); }
    });
  };

  slots.forEach((sl, i) => gsap.fromTo(sl.scale, { x: 0, y: 0, z: 0 }, { x: ss, y: ss, z: ss, duration: .8, delay: .2 + i * .08, ease: 'back.out(2)' }));
  keys.forEach((k, i) => {
    const h = k.userData.home, d = .1 + i * .035; k.scale.setScalar(ks);
    k.position.set(h.x, h.y - 5, -3); k.rotation.set(-Math.PI * 1.5, 0, rand(-.4, .4));
    gsap.to(k.position, { y: h.y, z: 0, duration: 1.1, delay: d, ease: 'expo.out', onComplete: () => k.userData.entered = true });
    gsap.to(k.rotation, { x: 0, z: 0, duration: 1.2, delay: d, ease: 'expo.out' });
  });
  R.update = t => {
    keys.forEach(k => idleFloat(k, t, .45));

  };

    const tl = gsap.timeline({ onComplete: () => t.userData.placed = true });

      .to(t.position, { z: 1.4, duration: .3, ease: 'sine.out' }, 0)

      .to(t.scale, { x: ss, y: ss, z: ss, duration: .6, ease: 'power3.inOut' }, 0)
      .fromTo(t.rotation, { x: -TAU }, { x: 0, duration: .6, ease: 'power3.out' }, 0)

        Speech.say(ans.chino, .75);
        slots.forEach((s, i) => { const tt = s.userData.tile; glowFace(tt, 4); gsap.to(tt.position, { y: '+=.35', duration: .25, delay: i * .09, yoyo: true, repeat: 1, ease: 'sine.out' }); });
        keys.forEach((kk, i) => gsap.to(kk.position, { y: '-=6', duration: .9, delay: .1 + i * .025, ease: 'power2.in' }));

  return R;
}

/* ---------------------------------------------------------------------
   MODO 4 · 听力 — Linternas celestes (audio → 汉字)
   --------------------------------------------------------------------- */
function roundListen() {
  const R = newRound('listen');
  const target = pickTarget(VOCAB);
  const opts = shuffle([target, ...charDistractors(target, 3)]);
  UI.prompt({ seal: '听', chip: 'Escucha', title: '¿Qué has oído?', sub: 'Toca el altavoz para repetir', speaker: true });
  R.speakText = target.chino;
  setTimeout(() => { if (round === R && !R.exiting) Speech.say(target.chino); }, 800);
  const ls = opts.map(o => { const L = makeSkyLantern(o.chino, R); L.userData.item = o; L.userData.onTap = () => choose(L); R.group.add(L); R.pick.push(L); return L; });
  let sc = 1;
  R.layout = () => {
    const A = area(); sc = Math.min(1.25, A.w / 4.1, A.h / 6);
    const sx = Math.min(1.2 * sc, A.w * .26), sy = Math.min(1.2 * sc, A.h * .23);
    const P = [[-sx, sy + .2 * sc], [sx, sy - .15 * sc], [-sx, -sy + .15 * sc], [sx, -sy - .2 * sc]];
    ls.forEach((L, i) => { L.userData.home = new THREE.Vector3(P[i][0], A.cy + P[i][1], rand(-.2, .2)); if (L.userData.entered) { L.position.copy(L.userData.home); L.scale.setScalar(sc); } });
  };
  R.layout();
  ls.forEach((L, i) => {
    const h = L.userData.home; L.scale.setScalar(sc);
    L.position.set(h.x + rand(-1, 1), area().bottom - 3.5 - i * .4, h.z - 2);
    gsap.to(L.position, { x: h.x, y: h.y, z: h.z, duration: 2.1 + i * .15, ease: 'power3.out', onComplete: () => L.userData.entered = true });
  });
  R.update = (t, dt) => ls.forEach((L, i) => {
    const u = L.userData;
    u.float.position.y = Math.sin(t * 1.1 + u.phase) * .08; u.float.rotation.z = Math.sin(t * .8 + u.phase) * .05;
    u.flame.scale.setScalar(.5 + Math.sin(t * 17 + i) * .05 + Math.sin(t * 29 + i * 2) * .04);
    if (!u.flying) u.paperMat.emissiveIntensity = (u.dead ? .08 : .5) + Math.sin(t * 9 + i * 3) * .04;
    if (u.flying && Math.random() < .6) sparks.burst(L.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, -.6 * sc, 0)), { count: 3, speed: [.2, .7], life: [.5, 1], size: [.03, .07], grav: -.4 });
  });
  function choose(L) {
    if (state.locked) return; state.locked = true; sfx.tap();
    const correct = ls.find(x => x.userData.item === target);
    if (L === correct) {
      Speech.say(target.chino);
      L.userData.flying = true;
      gsap.to(L.userData.paperMat, { emissiveIntensity: 2.4, duration: .4 });
      gsap.to(L.position, { y: '+=10', duration: 2.4, ease: 'power2.in' });
      gsap.to(L.position, { x: L.position.x * .3, z: -2, duration: 2.4, ease: 'sine.inOut' });
      celebrate(L, { palette: ['#fff1c9', '#ffd27a', '#ffb050'] });
      ls.filter(x => x !== L).forEach((o, i) => { o.userData.dead = true; gsap.to(o.position, { y: '-=7', duration: 1.3, delay: .1 + i * .06, ease: 'power2.in' }); });
      resolve(true, target);
    } else {
      L.userData.dead = true; gsap.to(L.userData.flame.material, { opacity: 0, duration: .4 }); gsap.to(L.userData.halo.material, { opacity: 0, duration: .4 });
      gsap.to(L.position, { y: '-=7', duration: 1.6, delay: .3, ease: 'power2.in' });
      gsap.to(correct.position, { z: 1.2, duration: .6, ease: 'back.out(2)' });
      gsap.to(correct.userData.halo.material, { opacity: .9, duration: .35, yoyo: true, repeat: 3 });
      resolve(false, target);
    }
  }
  return R;
}

/* ---------------------------------------------------------------------
   MODO 7 · 对话 — Conversación: responder, completar la palabra, traducir
   --------------------------------------------------------------------- */
function roundDialog() {
  const sub = new URLSearchParams(location.search).get('sub') || pick(['reply', 'reply', 'blank', 'blank', 'meaning']);
  if (sub === 'blank') return dialogBlank();
  return dialogPlaques(sub === 'meaning');
}
// Opciones en placas: respuesta correcta a una frase, o su traducción
function dialogPlaques(meaning) {
  const R = newRound('dialog');
  let correct, opts, ans;
  if (meaning) {
    const P = withName(pick(Object.values(PHRASES)));
    correct = P.es; ans = phraseAns(P);
    opts = shuffle([P.es, ...shuffle(Object.values(PHRASES).filter(x => x.id !== P.id).map(x => x.es)).slice(0, 3)]);
    UI.prompt({ seal: '话', chip: 'Conversación', title: '¿Qué significa?', long: true, sub: 'Elige la traducción correcta', speaker: true,
      chat: bubble('a', 'A', P.zh, P.py, '') });
    R.speakText = P.zh;
  } else {
    const D = pick(REPLIES), Q = withName(PHRASES[D.q]), A = PHRASES[pick(D.ok)];
    correct = A.zh; ans = phraseAns(A);
    opts = shuffle([A.zh, ...shuffle(D.bad).slice(0, 3).map(k => PHRASES[k].zh)]);
    UI.prompt({ seal: '话', chip: 'Conversación', title: '¿Qué contestas?', long: true, sub: 'Elige la respuesta lógica', speaker: true,
      chat: bubble('a', 'A', Q.zh, Q.py, Q.es) + `<div class="bub b"><span class="who">Tú</span><div class="wait">• • •</div></div>` });
    R.speakText = Q.zh;
  }
  setTimeout(() => { if (round === R && !R.exiting) Speech.say(R.speakText, .8); }, 800);
  const plaques = opts.map(o => {
    const P = meaning ? makePlaque(o, R) : makePlaque(o, R, Object.values(PHRASES).find(x => x.zh === o).py);
    P.userData.val = o; P.userData.onTap = () => choose(P); R.group.add(P); R.pick.push(P); return P;
  });
  let s = 1;
  R.layout = () => {
    const A = area(); s = Math.min(1.15, (A.w * .9) / PLQ.w, A.h / (4 * (PLQ.h + .26)));
    plaques.forEach((P, i) => {
      P.userData.home = new THREE.Vector3(0, A.cy + (1.5 - i) * (PLQ.h + .26) * s, 0);
      if (P.userData.entered) { P.position.copy(P.userData.home); P.scale.setScalar(s); }
    });
  };
  R.layout();
  plaques.forEach((P, i) => {
    const h = P.userData.home, side = i % 2 ? 1 : -1, d = .15 + i * .09; P.scale.setScalar(s);
    P.position.set(side * 7, h.y, -3); P.rotation.set(0, -side * 1.4, side * .3);
    gsap.to(P.position, { x: 0, z: 0, duration: 1.2, delay: d, ease: 'expo.out', onComplete: () => P.userData.entered = true });
    gsap.to(P.rotation, { y: 0, z: 0, duration: 1.4, delay: d, ease: 'expo.out' });
  });
  R.update = t => plaques.forEach(P => idleFloat(P, t, .5));
  function choose(P) {
    if (state.locked) return; state.locked = true; sfx.tap();
    const C = plaques.find(x => x.userData.val === correct);
    gsap.killTweensOf(P.position); gsap.killTweensOf(P.rotation);
    if (P === C) {
      Speech.say(ans.chino, .8);
      if (!meaning) { const b = $('#chat .bub.b'); if (b) b.innerHTML = `<span class="who">Tú</span><div class="zh">${ans.chino}</div><div class="py">${ans.pinyin}</div>`; }
      gsap.to(P.position, { y: area().cy, z: 1.4, duration: .8, ease: 'expo.out' });
      gsap.fromTo(P.rotation, { x: 0 }, { x: TAU, duration: 1, ease: 'power3.out' });
      glowFace(P, 3); setTimeout(() => celebrate(P), 120);
      plaques.filter(x => x !== P).forEach((o, i) => { gsap.killTweensOf(o.position); gsap.to(o.position, { x: (i % 2 ? 1 : -1) * 7, duration: .8, delay: i * .05, ease: 'power2.in' }); });
      resolve(true, ans);
    } else {
      rejectTile(P);
      gsap.to(C.position, { z: .9, duration: .6, ease: 'back.out(2)' }); glowFace(C, 2.5);
      resolve(false, ans);
    }
  }
  return R;
}
// Frase con un hueco: tocar la ficha con el carácter que falta
function dialogBlank() {
  const R = newRound('dialog');
  const P = withName(PHRASES[pick(['ma', 'ma', 'ne', 'ne', 'ye', 'ye', 'bu'])]);
  const idxs = P.t.map((x, i) => i).filter(i => !isPunct(P.t[i]));
  const gi = pick(idxs), miss = P.t[gi], target = WORDS.find(w => w.chino === miss.c);
  const zhHtml = P.t.map((x, i) => i === gi ? '<span class="gap">？</span>' : x.c).join('');
  const pyHtml = P.t.reduce((acc, x, i) => { const v = i === gi ? '<span class="gap">&nbsp;?&nbsp;</span>' : x.p; return isPunct(x) ? acc + v : (acc ? acc + ' ' : '') + v; }, '');
  UI.prompt({ seal: '话', chip: 'Conversación', title: 'Completa la frase', long: true, sub: 'Toca el carácter que falta',
    chat: bubble('a', 'A', zhHtml, pyHtml, P.es) });
  const opts = shuffle([target, ...shuffle(WORDS.filter(w => w !== target && !P.t.some(x => x.c === w.chino))).slice(0, 3)]);
  const ans = phraseAns(P);
  const tiles = opts.map(o => { const t = makeTile(o.chino, R); t.userData.item = o; t.userData.onTap = () => choose(t); R.group.add(t); R.pick.push(t); return t; });
  let s = 1;
  R.layout = () => {
    const A = area(); s = Math.min(1.2, (A.w * .92) / (4 * TILE.w + 3 * .22), (A.h * .8) / TILE.h);
    tiles.forEach((t, i) => {
      t.userData.home = new THREE.Vector3((i - 1.5) * (TILE.w + .22) * s, A.cy, 0);
      if (t.userData.entered) { t.position.copy(t.userData.home); t.scale.setScalar(s); }
    });
  };
  R.layout();
  tiles.forEach((t, i) => {
    const h = t.userData.home, d = .12 + i * .08; t.scale.setScalar(s);
    t.position.set(h.x * 2, h.y - 6, -8); t.rotation.set(rand(-4, 4), rand(-4, 4), rand(-1, 1));
    gsap.to(t.position, { x: h.x, y: h.y, z: 0, duration: 1.2, delay: d, ease: 'expo.out', onComplete: () => t.userData.entered = true });
    gsap.to(t.rotation, { x: 0, y: 0, z: 0, duration: 1.4, delay: d, ease: 'expo.out' });
  });
  R.update = t => tiles.forEach(x => idleFloat(x, t));
  function choose(tile) {
    if (state.locked) return; state.locked = true; sfx.tap();
    gsap.killTweensOf(tile.position); gsap.killTweensOf(tile.rotation);
    const fill = () => { const g = $('#chat .gap'); if (g) { g.textContent = miss.c; g.style.animation = 'none'; } const gp = $('#chat .py .gap'); if (gp) gp.textContent = miss.p; };
    if (tile.userData.item === target) {
      fill(); Speech.say(P.zh, .8);
      gsap.to(tile.position, { y: tile.position.y + .4, z: 1.6, duration: .8, ease: 'expo.out' });
      gsap.to(tile.rotation, { y: TAU, duration: 1, ease: 'power3.out' });
      glowFace(tile); setTimeout(() => celebrate(tile), 120);
      tiles.filter(x => x !== tile).forEach((o, i) => { gsap.killTweensOf(o.position); gsap.to(o.position, { y: '-=8', z: -4, duration: 1, delay: i * .05, ease: 'power2.in' }); });
      resolve(true, ans);
    } else {
      rejectTile(tile);
      const ct = tiles.find(x => x.userData.item === target);
      gsap.to(ct.position, { z: 1.1, duration: .7, ease: 'back.out(2)' }); glowFace(ct, 4);
      setTimeout(fill, 500);
      resolve(false, ans);
    }
  }
  return R;
}

  let s = 1;

    gsap.to(P.position, { x: 0, z: 0, duration: 1.2, delay: d, ease: 'expo.out', onComplete: () => P.userData.entered = true });
    gsap.to(P.rotation, { y: 0, z: 0, duration: 1.4, delay: d, ease: 'expo.out' });
  });
  R.update = t => plaques.forEach(P => idleFloat(P, t, .5));
  function choose(P) {

    gsap.killTweensOf(P.position); gsap.killTweensOf(P.rotation);
    if (P === correct) {
      Speech.say(ans.chino, .8);
      gsap.to(P.position, { y: area().cy, z: 1.4, duration: .8, ease: 'expo.out' });

      gsap.to(correct.position, { z: .9, duration: .6, ease: 'back.out(2)' }); glowFace(correct, 2.5);
      resolve(false, ans);

/* =====================================================================
   INTERACCIÓN · RESIZE · BUCLE
   ===================================================================== */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), pointer = { x: 0, y: 0 };
function ripple(x, y) { const d = document.createElement('div'); d.className = 'ripple'; d.style.left = x + 'px'; d.style.top = y + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 600); }

window.addEventListener('pointerdown', () => {
  Speech.unlock(); sfx.init();
  const h = $('#hint'); if (h && !h.dataset.gone) { h.dataset.gone = 1; gsap.to(h, { opacity: 0, y: 10, duration: .4, onComplete: () => h.remove() }); }
}, { capture: true });

canvas.addEventListener('pointerdown', e => {
  ripple(e.clientX, e.clientY);
  pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = -(e.clientY / innerHeight * 2 - 1);
  if (state.skip) { state.skip(); return; }
  if (state.locked || !round || round.exiting) return;
  ndc.set(pointer.x, pointer.y); raycaster.setFromCamera(ndc, camera);
  for (const hit of raycaster.intersectObjects(round.pick, true)) {
    let o = hit.object; while (o && !o.userData.onTap) o = o.parent;
    if (o) { o.userData.onTap(); break; }
  }
});
window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = -(e.clientY / innerHeight * 2 - 1); } });
window.addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  pointer.x = THREE.MathUtils.clamp(e.gamma / 30, -1, 1); pointer.y = THREE.MathUtils.clamp((e.beta - 45) / 30, -1, 1);
});
$('#speak').addEventListener('click', e => {
  e.stopPropagation();
  if (!round || round.exiting) return;
  if (round.mode === 'orbit') round.group.children[0].userData.onTap();
  else if (round.speakText) { sfx.tap(); Speech.say(round.speakText); }
});

function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = aspect;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  view.dist = THREE.MathUtils.clamp(4.7 / (2 * tanH * aspect), 9, 16);
  camera.position.set(0, 0, view.dist); camera.updateProjectionMatrix();
  view.h = 2 * tanH * view.dist; view.w = view.h * aspect;
  bgMat.uniforms.uAspect.value = aspect;
  U.ptScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y * .5 / tanH;
  layoutDecor();
  if (round && !round.exiting) round.layout();
}
window.addEventListener('resize', () => { _safeB = null; resize(); });
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// La insignia HTML sigue a la moneda 3D, sobre su borde inferior derecho
const _tagV = new THREE.Vector3(), tagEl = $('#coin-tag');
function placeCoinTag() {
  const c = round.coin; c.getWorldPosition(_tagV); _tagV.x += c.scale.x * .72; _tagV.y -= c.scale.y * .72; _tagV.project(camera);
  tagEl.style.left = (_tagV.x + 1) / 2 * innerWidth + 'px'; tagEl.style.top = (1 - _tagV.y) / 2 * innerHeight + 'px';
}
tagEl.addEventListener('click', e => {
  e.stopPropagation();
  if (round && round.coin && !round.exiting) round.coin.userData.onTap();
});
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
  U.time.value = t; bgMat.uniforms.uTime.value = t;
  const k = Math.min(1, dt * 2.5);
  world.rotation.y += (pointer.x * .12 - world.rotation.y) * k;
  world.rotation.x += (-pointer.y * .07 - world.rotation.x) * k;
  if (round && !round.exiting) round.update(t, dt);
  if (round && round.coin && !round.exiting) placeCoinTag();
  updateDecor(t, dt);
  sparks.update(dt);
  composer.render();
}

   ===================================================================== */
async function loadFonts() {
  const zh = VOCAB.map(v => v.chino).join('') + '福对很好太棒了真汉字音数听拼对话我你吗呢不！？，。';
  const py = VOCAB.map(v => v.pinyin).join('') + 'āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü';
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`900 64px "Noto Serif SC"`, zh), document.fonts.load(`700 64px "Noto Serif SC"`, zh),
        document.fonts.load(`700 64px "Noto Serif"`, py), document.fonts.load(`600 16px Inter`, 'Aa'),
      ]),
      sleep(4000),
    ]);
  } catch (e) {}
}
(async () => {
  await loadFonts();
  buildDecor();
  resize();
  frame();
  // Precalienta shaders y texturas para que la primera ronda no tartamudee
  const warm = { disposables: [] };
  const tmp = [makeTile('一', warm), makeLantern('yī', warm), makeSkyLantern('一', warm), makeCoin('一', warm)];
  tmp.forEach(o => { o.position.z = -50; scene.add(o); });
  renderer.compile(scene, camera);
  tmp.forEach(o => scene.remove(o)); warm.disposables.forEach(m => m.dispose());
  rig.rotation.set(rand(-.1, .05), (Math.random() < .5 ? -1 : 1) * .32, 0); rig.position.z = 3;
  gsap.to('#loader', { opacity: 0, duration: .7, ease: 'power2.out', onComplete: () => $('#loader').remove() });
  startRound();
  // Sube a la GPU las texturas de todos los caracteres en ratos libres, para que ninguna ronda nueva tartamudee
  const queue = VOCAB.flatMap(v => [() => tileFaceTex(v.chino), () => inkTex(v.chino), () => labelTex(v.pinyin)]);
  const idle = window.requestIdleCallback || (f => setTimeout(f, 150));
  const pump = () => { const f = queue.shift(); if (!f) return; renderer.initTexture(f()); idle(pump); };
  setTimeout(pump, 2500);
})();

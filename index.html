<style>
  :root{
    --gold:#f3c56b; --gold-hi:#fff1cc; --gold-lo:#b8812c;
    --ink:#22030a; --hair:rgba(255,212,145,.22);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --serif:"Noto Serif","Noto Serif SC",Georgia,serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0306;color:#fff;
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(var(--safe-t) + 14px) 16px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;
    background:rgba(38,4,9,.42);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
    font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,232,195,.86);
    box-shadow:inset 0 1px 0 rgba(255,240,210,.08),0 10px 24px -12px rgba(0,0,0,.7)}
  .seal{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;letter-spacing:0;
    font-family:var(--zh);font-weight:900;font-size:14px;color:#ffe7b3;
    background:linear-gradient(145deg,#e0402f,#8a0d14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 8px rgba(120,0,0,.55)}
  #card{position:relative;width:min(520px,100%);padding:16px 22px 18px;border-radius:26px;text-align:center;overflow:hidden;
    background:linear-gradient(180deg,rgba(96,15,20,.52),rgba(34,4,8,.52));
    border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,235,200,.13),0 28px 60px -24px rgba(0,0,0,.8)}
  #card::before{content:"";position:absolute;left:18%;right:18%;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,215,140,.75),transparent)}
  #card.has-speaker{padding-left:62px;padding-right:62px}
  #card.has-speaker .title{font-size:clamp(26px,7.4vw,38px)}
  .title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.12;letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff7e2 10%,#f5cd7a 70%,#d9a04a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,170,60,.18))}
  .title.number{font-family:var(--sans);font-weight:700;font-size:clamp(58px,18vw,86px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  #card .title.long{font-size:clamp(25px,7.2vw,36px)}
  .sub{margin-top:7px;font-size:14px;font-weight:500;color:rgba(255,226,192,.72);line-height:1.35}
  #speak{position:absolute;right:10px;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;
    display:none;place-items:center;pointer-events:auto;cursor:pointer;border:1px solid rgba(255,215,140,.35);
    color:#ffe2a6;background:radial-gradient(circle at 50% 30%,rgba(255,190,90,.30),rgba(120,16,18,.35));
    box-shadow:inset 0 1px 0 rgba(255,240,210,.2),0 6px 18px -6px rgba(0,0,0,.7)}
  #card.has-speaker #speak{display:grid}
  #speak:active{transform:scale(.92)}
  #speak::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgba(255,210,130,.7);opacity:0}
  body.speaking #speak::after{animation:ring 1.1s ease-out infinite}
  body.speaking #speak .w1{animation:wave 0.9s ease-in-out infinite}
  body.speaking #speak .w2{animation:wave 0.9s .15s ease-in-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  @keyframes wave{50%{opacity:.25}}

  /* ---------- Reveal (fallo) ---------- */
  #reveal{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:7;margin:0 auto;max-width:520px;
    border-radius:30px;padding:16px 20px 18px;pointer-events:none;transform:translateY(140%);
    background:linear-gradient(180deg,rgba(70,10,14,.78),rgba(26,3,7,.86));border:1px solid rgba(255,140,110,.28);
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,220,200,.12),0 -10px 60px -20px rgba(0,0,0,.8)}
  #reveal.on{pointer-events:auto}
  .rv-head{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,190,170,.8)}
  .rv-head em{font-style:normal;letter-spacing:.02em;text-transform:none;font-weight:500;color:rgba(255,225,200,.45)}
  .rv-body{display:flex;align-items:center;gap:18px;margin-top:10px}
  .rv-char{flex:none;min-width:88px;height:88px;padding:0 14px;border-radius:22px;display:grid;place-items:center;
    font-family:var(--zh);font-weight:900;font-size:58px;line-height:1;color:#7d0f14;
    background:linear-gradient(180deg,#fbf3df,#e8dbbb);box-shadow:inset 0 -6px 0 #1b4f9c,inset 0 1px 0 #fff,0 10px 24px -10px rgba(0,0,0,.8)}
  .rv-char.long{font-size:40px}
  .rv-char.xl{font-size:26px;height:auto;min-height:88px;max-width:58%;padding:10px 14px;line-height:1.25}
  .rv-txt{min-width:0}
  .rv-py{font-family:var(--serif);font-weight:700;font-size:28px;color:#ffe2a6;line-height:1.1}
  .rv-es{margin-top:4px;font-size:16px;color:rgba(255,232,210,.78)}
  .rv-char.xl + .rv-txt .rv-py{font-size:20px;line-height:1.25}
  .rv-char.xl + .rv-txt .rv-es{font-size:14px}
  .rv-head em{margin-left:auto}
  .rv-say{flex:none;margin:-6px -6px -6px 10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
    border:1px solid rgba(255,215,140,.35);color:#ffe2a6;background:radial-gradient(circle at 50% 30%,rgba(255,190,90,.28),rgba(120,16,18,.35))}
  .rv-say:active{transform:scale(.92)}
  .rv-why{margin-top:12px;font-size:14px;line-height:1.45;color:rgba(255,236,214,.92)}
  .rv-why:empty{display:none}
  .rv-was{display:inline-block;margin-right:8px;padding:1px 9px;border-radius:9px;background:rgba(255,90,70,.16);color:rgba(255,196,178,.9);font-size:13px}
  .rv-was s{font-family:var(--zh);font-weight:700;text-decoration-color:#ff5a46;text-decoration-thickness:2px}
  #reveal.held .rv-bar i{opacity:.3}
  /* Tonos en color (solo en las respuestas) */
  .t1{color:#ffe08a}.t2{color:#8ee6b4}.t3{color:#9fd0ff}.t4{color:#ffa48c}
  /* Sello 复: esta ronda repasa algo que fallaste hace poco */
  .review{display:none;margin-left:2px;width:20px;height:20px;border-radius:6px;place-items:center;letter-spacing:0;
    font-family:var(--zh);font-weight:900;font-size:12px;color:#fff3dc;background:linear-gradient(145deg,#ff5a46,#a3121b)}
  .review.on{display:grid}
  .rv-bar{margin-top:14px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .rv-bar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,#f3c56b,#ff7a4a)}

  /* ---------- Hint / loader / ripple ---------- */
  /* Insignia de altavoz pegada a la moneda (modo pinyin) */
  #coin-tag{position:fixed;left:0;top:0;z-index:4;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:0;padding:0;
    display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;color:#2a0408;
    background:linear-gradient(180deg,#ffe7ad,#e5a443);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 3px rgba(60,6,10,.55),0 8px 20px -6px rgba(0,0,0,.8)}
  #coin-tag.on{pointer-events:auto}
  #coin-tag::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,214,140,.8);animation:ring 1.6s ease-out infinite}
  #coin-tag:active{transform:scale(.92)}
  .meta{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:13px;color:rgba(255,226,192,.75);
    background:rgba(0,0,0,.18);border:1px solid rgba(255,212,145,.16)}
  .meta b{font-family:var(--zh);font-size:16px;color:#fff1d2;font-weight:700}
  .meta:empty{display:none}
  /* Burbujas de conversación */
  .chat{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
  .chat:empty{display:none}
  .bub{position:relative;max-width:86%;padding:8px 14px 9px;border-radius:18px;background:rgba(255,236,214,.09);border:1px solid rgba(255,212,145,.2)}
  .bub.a{align-self:flex-start;border-bottom-left-radius:6px}
  .bub.b{align-self:flex-end;border-bottom-right-radius:6px;background:linear-gradient(180deg,rgba(243,197,107,.26),rgba(190,110,40,.2));border-color:rgba(255,212,145,.35)}
  .bub .who{position:absolute;top:-8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,215,160,.7)}
  .bub.a .who{left:12px}.bub.b .who{right:12px}
  .bub .zh{font-family:var(--zh);font-weight:700;font-size:23px;line-height:1.3;color:#fff3d6}
  .bub .py{font-family:var(--serif);font-size:14.5px;color:#ffd99a}
  .bub .es{margin-top:2px;font-size:12.5px;color:rgba(255,226,192,.62)}
  .gap{display:inline-block;min-width:1.15em;margin:0 2px;text-align:center;border-bottom:2px solid #f3c56b;color:#f3c56b;animation:breath 1.6s ease-in-out infinite}
  .bub .wait{font-size:22px;letter-spacing:4px;color:#f3c56b;animation:breath 1.2s ease-in-out infinite}
  @keyframes breath{50%{opacity:.55}}
  #loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#4a0a0f,#140205 70%)}
  #loader .seal{width:76px;height:76px;border-radius:20px;font-size:44px;animation:pulse 1.4s ease-in-out infinite}
  #loader p{margin:18px 0 0;text-align:center;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,220,180,.6)}
  #loader>div{display:flex;flex-direction:column;align-items:center}
  /* Sello de entrada 开始: el primer toque activa la voz y los sonidos (iOS lo exige) */
  #loader.ready{cursor:pointer}
  #loader.ready .seal{width:112px;height:112px;border-radius:28px;font-size:40px;letter-spacing:-.04em;animation:pulse 1.8s ease-in-out infinite}
  #loader.ready p{font-size:13px;letter-spacing:.2em;color:rgba(255,226,190,.82);animation:breath 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(.92);filter:brightness(1.25)}}
  .ripple{position:fixed;z-index:8;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;
    border:2px solid rgba(255,214,140,.9);box-shadow:0 0 14px rgba(255,180,80,.6);animation:rip .55s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rip{to{transform:scale(7);opacity:0;border-width:.5px}}

  /* ---------- Temas ---------- */
  .hud-row{display:flex;align-items:center;justify-content:center;gap:8px;max-width:100%}
  #topic-btn{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:999px;
    font:600 13px var(--sans);color:#fff1d2;white-space:nowrap;
    background:linear-gradient(180deg,rgba(243,197,107,.30),rgba(150,70,20,.28));border:1px solid rgba(255,214,140,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,240,210,.2),0 8px 20px -10px rgba(0,0,0,.8)}
  #topic-btn:active{transform:scale(.95)}
  #topic-btn svg{opacity:.8}
  @media (max-width:370px){#topic-name{display:none}}
  #topics{position:fixed;inset:0;z-index:15;display:none;align-items:flex-end;justify-content:center;
    background:rgba(12,1,3,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #topics.on{display:flex}
  .sheet{width:min(520px,100%);margin:0 12px calc(var(--safe-b) + 12px);padding:18px 14px 14px;border-radius:30px;
    background:linear-gradient(180deg,rgba(80,12,16,.92),rgba(26,3,7,.96));border:1px solid var(--hair);
    box-shadow:inset 0 1px 0 rgba(255,220,200,.12),0 -10px 60px -20px rgba(0,0,0,.8)}
  .sheet h2{margin:0 6px 12px;font:600 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,215,160,.75)}
  .topic{display:flex;align-items:center;gap:14px;width:100%;margin-top:8px;padding:11px 14px;border-radius:20px;text-align:left;cursor:pointer;
    background:rgba(255,236,214,.06);border:1px solid rgba(255,212,145,.14);color:#fff;font-family:var(--sans)}
  .topic:active{transform:scale(.98)}
  .topic.on{background:linear-gradient(180deg,rgba(243,197,107,.24),rgba(190,110,40,.16));border-color:rgba(255,214,140,.55)}
  .topic .seal{flex:none;width:40px;height:40px;border-radius:12px;font-size:22px}
  .topic b{display:block;font-size:16px;font-weight:600;color:#fff1d2}
  .topic span{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:rgba(255,226,192,.65)}
</style>

<body>

<header id="hud">
  <div class="hud-row">
    <button id="topic-btn" aria-label="Elegir tema"><span id="topic-seal" class="seal">全</span><span id="topic-name">Mezcla</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div id="chip" class="chip"><span id="seal" class="seal">字</span><span id="chip-text">Cargando</span><span id="review" class="review" title="Repaso de un fallo">复</span></div>
  </div>
  <div id="card">
    <div id="card-in"><div id="title" class="title">&nbsp;</div><div id="sub" class="sub">&nbsp;</div><div id="meta" class="meta"></div><div id="chat" class="chat"></div></div>
    <button id="speak" aria-label="Escuchar otra vez">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6.5 9H3.5v6h3l4.5 4V5z" fill="currentColor" stroke="none"/>
        <path class="w1" d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4"/><path class="w2" d="M18.4 5.9a8.8 8.8 0 0 1 0 12.2"/>
      </svg>
    </button>
  </div>
</header>


<div id="reveal">
  <div class="rv-head"><span>La respuesta era</span><em>toca para seguir</em><button class="rv-say" id="rv-say" aria-label="Escuchar despacio"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 5 6.5 9H3.5v6h3l4.5 4V5z"/><path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  <div class="rv-body">
    <div class="rv-char" id="rv-char">马</div>
    <div class="rv-txt"><div class="rv-py" id="rv-py">mǎ</div><div class="rv-es" id="rv-es">Caballo</div></div>
  </div>
  <div class="rv-why" id="rv-why"></div>
  <div class="rv-bar"><i id="rv-bar"></i></div>
</div>

<button id="coin-tag" aria-label="Escuchar el carácter"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11 5 6.5 9H3.5v6h3l4.5 4V5z"/><path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4M18.4 5.9a8.8 8.8 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
<div id="topics"><div class="sheet"><h2>¿Qué quieres practicar?</h2><div id="topic-list"></div></div></div>
<div id="loader"><div><div class="seal">汉</div><p>加载中</p></div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const gsap = window.gsap;

/* =====================================================================
   VOCABULARIO
   ===================================================================== */
const VOCAB = [
  { espanol: "Uno", chino: "一", pinyin: "yī" }, { espanol: "Dos", chino: "二", pinyin: "èr" },
  { espanol: "Tres", chino: "三", pinyin: "sān" }, { espanol: "Cuatro", chino: "四", pinyin: "sì" },
  { espanol: "Cinco", chino: "五", pinyin: "wǔ" }, { espanol: "Seis", chino: "六", pinyin: "liù" },
  { espanol: "Siete", chino: "七", pinyin: "qī" }, { espanol: "Ocho", chino: "八", pinyin: "bā" },
  { espanol: "Nueve", chino: "九", pinyin: "jiǔ" }, { espanol: "Diez", chino: "十", pinyin: "shí" },
  { espanol: "Fuerza", chino: "力", pinyin: "lì" }, { espanol: "Puerta", chino: "门", pinyin: "mén" },

// Caché de texturas. Lo acotado (fichas, tinta, pinyin del vocabulario, papel, huecos, brillo) se queda siempre;
// lo que crece sin límite (monedas, placas, cartas y variantes de tono del pinyin) se libera por antigüedad cuando
// pasa de un presupuesto en bytes de GPU, y nunca si lo usa una ronda que sigue viva.

function cached(key, make) {

}

const evictable = k => /^(coin|plq|card):/.test(k) || (k.startsWith('py:') && !(VOCAB_PY || (VOCAB_PY = new Set(VOCAB.map(v => v.pinyin)))).has(k.slice(3)));

  let total = 0; for (const [k, e] of texCache) if (evictable(k)) total += e.t.userData.bytes;
  for (const [k, e] of texCache) {   // de la menos reciente a la más reciente
    if (total <= budget) break;
    if (!evictable(k) || e.used >= minAlive) continue;
    texCache.delete(k); total -= e.t.userData.bytes; e.t.dispose();

function canvasTexture(w, h, draw, srgb = true) {

}

const bgMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uAspect: { value: 1 }, uFlash: { value: 0 }, uFlashColor: { value: new THREE.Color(1, .7, .3) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uTime, uAspect, uFlash; uniform vec3 uFlashColor;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
    void main(){
      vec2 p = (vUv - .5) * vec2(uAspect, 1.);
      float d = length(p - vec2(0., .05));
      vec3 deep = vec3(.014,.001,.003), mid = vec3(.105,.008,.012), warm = vec3(.42,.075,.02);
      vec3 col = mix(mid, deep, smoothstep(.0, .95, d));
      col += warm * exp(-d*d*5.) * .34;
      // humo / nubes xiangyun
      float t = uTime;
      float n  = fbm(p*2.1 + vec2(t*.018, -t*.03));
      float n2 = fbm(p*3.6 + vec2(-t*.025, t*.012) + n*1.6);
      col += vec3(.3,.055,.018) * pow(n2, 2.6) * .6;
      // luna
      vec2 mp = vec2(min(.5*uAspect - .16, .42), .3);
      float md = length(p - mp);
      col += vec3(1.,.66,.34) * (smoothstep(.07,.064,md) * .42 + exp(-md*md*60.) * .14 + exp(-md*md*6.) * .04);
      // flash de acierto / fallo
      col += uFlashColor * uFlash * exp(-d*d*2.4) * .55;
      col *= 1. - smoothstep(.38, 1.15, length(p * vec2(.95, .78)));
      col += (hash(gl_FragCoord.xy + fract(t)*100.) - .5) * .008;
      gl_FragColor = vec4(max(col, 0.), 1.);
    }`

const U = { time: { value: 0 }, ptScale: { value: 1000 } };

function ambientPoints({ count, w, h, z0, z1, size, colors, speed, soft, alpha }) {
  const pos = new Float32Array(count * 3), seed = new Float32Array(count * 3), col = new Float32Array(count * 3), c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    pos.set([rand(-w / 2, w / 2), rand(-h / 2, h / 2), rand(z0, z1)], i * 3);
    seed.set([Math.random(), rand(speed[0], speed[1]), rand(size[0], size[1])], i * 3);
    c.set(pick(colors)).multiplyScalar(alpha * rand(.55, 1)); col.set([c.r, c.g, c.b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.time, uScale: U.ptScale, uH: { value: h }, uSoft: { value: soft } },
    vertexShader: `
      uniform float uTime, uScale, uH; attribute vec3 aSeed; attribute vec3 aColor; varying vec3 vColor; varying float vA;
      void main(){
        vec3 p = position;
        p.y = mod(p.y + uTime * aSeed.y + uH * .5, uH) - uH * .5;
        p.x += sin(uTime * .35 + aSeed.x * 6.2831) * .6 * aSeed.y;
        vec4 mv = modelViewMatrix * vec4(p, 1.);
        gl_PointSize = aSeed.z * uScale / -mv.z;
        gl_Position = projectionMatrix * mv;
        float tw = .65 + .35 * sin(uTime * (1.3 + aSeed.x * 2.7) + aSeed.x * 50.);
        vA = tw * smoothstep(.5 * uH, .36 * uH, abs(p.y)); vColor = aColor;
      }`,
    fragmentShader: `
      uniform float uSoft; varying vec3 vColor; varying float vA;
      void main(){
        float d = length(gl_PointCoord - .5) * 2.; if (d > 1.) discard;
        float core = exp(-d * d * 4.5);
        float disc = (1. - smoothstep(.8, 1., d)) * (.55 + .45 * smoothstep(.3, .95, d));
        gl_FragColor = vec4(vColor * mix(core, disc, uSoft) * vA, 1.);
      }`
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; return pts;
}

class Sparks {
  constructor(n = 1100) {
    this.n = n; this.i = 0;
    this.pos = new Float32Array(n * 3); this.col = new Float32Array(n * 3);
    this.size = new Float32Array(n); this.alpha = new Float32Array(n);
    this.vel = new Float32Array(n * 3); this.life = new Float32Array(n); this.max = new Float32Array(n).fill(1); this.grav = new Float32Array(n);
    const geo = new THREE.BufferGeometry();
    this.aPos = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage);
    this.aAlpha = new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', this.aPos); geo.setAttribute('aColor', this.aCol); geo.setAttribute('aSize', this.aSize); geo.setAttribute('aAlpha', this.aAlpha);
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uScale: U.ptScale },
      vertexShader: `
        uniform float uScale; attribute float aSize, aAlpha; attribute vec3 aColor; varying vec3 vColor; varying float vA;
        void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.);
          gl_PointSize = step(.001, aAlpha) * aSize * uScale / -mv.z * (.35 + .65 * aAlpha);
          gl_Position = projectionMatrix * mv; vColor = aColor; vA = aAlpha; }`,
      fragmentShader: `
        varying vec3 vColor; varying float vA;
        void main(){ float d = length(gl_PointCoord - .5) * 2.; if (d > 1.) discard;
          float a = exp(-d * d * 5.) + .7 * exp(-d * d * 40.); gl_FragColor = vec4(vColor * a * vA, 1.); }`
    });

  }
  burst(p, { count = 160, palette = ['#ffd27a', '#ff8a3d', '#fff1c9', '#e8402e'], speed = [1.5, 5.5], life = [.6, 1.5], size = [.05, .16], grav = 2.6, hdr = [1.6, 3.4], spread = 0 } = {}) {
    const c = new THREE.Color();
    for (let k = 0; k < count; k++) {
      const i = this.i = (this.i + 1) % this.n;
      const u = rand(-1, 1), th = rand(0, TAU), r = Math.sqrt(1 - u * u), s = rand(speed[0], speed[1]);
      this.pos.set([p.x + rand(-spread, spread), p.y + rand(-spread, spread), p.z], i * 3);
      this.vel.set([r * Math.cos(th) * s, u * s + s * .25, r * Math.sin(th) * s * .6 + .8], i * 3);
      this.life[i] = this.max[i] = rand(life[0], life[1]); this.grav[i] = grav;
      this.size[i] = rand(size[0], size[1]);
      c.set(pick(palette)).multiplyScalar(rand(hdr[0], hdr[1])); this.col.set([c.r, c.g, c.b], i * 3);
    }
    this.active = 2.5;
  }
  update(dt) {
    if (this.active <= 0) return; this.active -= dt;
    const drag = Math.exp(-1.9 * dt);
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.alpha[i] = 0; continue; }
      this.life[i] -= dt; const j = i * 3;
      this.vel[j] *= drag; this.vel[j + 1] = this.vel[j + 1] * drag - this.grav[i] * dt; this.vel[j + 2] *= drag;
      this.pos[j] += this.vel[j] * dt; this.pos[j + 1] += this.vel[j + 1] * dt; this.pos[j + 2] += this.vel[j + 2] * dt;
      this.alpha[i] = Math.pow(Math.max(this.life[i] / this.max[i], 0), 1.4);
    }
    this.aPos.needsUpdate = this.aCol.needsUpdate = this.aSize.needsUpdate = this.aAlpha.needsUpdate = true;
  }
}

      gr.addColorStop(0, `rgba(${L.col},${L.a})`); gr.addColorStop(Math.min(L.fade * .6, 1), `rgba(${L.col},${L.a * .55})`); gr.addColorStop(1, `rgba(${L.col},${li === 2 ? L.a : 0})`);

}
function layoutDecor() {

function updateDecor(t, dt) {
  decor.lanterns.forEach((L, i) => {

  coinTag(show) {
    const el = $('#coin-tag'); el.classList.toggle('on', show);
    gsap.to(el, { opacity: show ? 1 : 0, scale: show ? 1 : .5, duration: show ? .5 : .2, delay: show ? .6 : 0, ease: show ? 'back.out(2)' : 'power2.in', overwrite: true });
  },
  // info: { picked: lo que tocaste, why: por qué no era eso }. Toque corto: seguir. Mantener: congelar para leer.
  reveal(ans, info = {}) {
    return new Promise(res => {
      const el = $('#reveal'), c = $('#rv-char');
      c.textContent = ans.chino; c.classList.toggle('long', ans.chino.length > 1 && ans.chino.length <= 3); c.classList.toggle('xl', ans.chino.length > 3);
      $('#rv-py').innerHTML = pyHTML(ans.pinyin); $('#rv-es').textContent = ans.espanol;
      const was = info.picked ? `<span class="rv-was">Tocaste <s>${info.picked}</s></span>` : '';
      $('#rv-why').innerHTML = was + (info.why || '');
      const dur = info.why ? 6000 : 4200;   // con explicación hay más que leer
      el.classList.remove('held'); el.classList.add('on');
      gsap.fromTo(el, { y: 0, yPercent: 140 }, { yPercent: 0, duration: .65, ease: 'expo.out' });
      gsap.fromTo('#rv-bar', { scaleX: 1 }, { scaleX: 0, duration: dur / 1000, ease: 'none' });
      let done = false, hold = null;
      const finish = () => {
        if (done) return; done = true; state.skip = null; clearTimeout(tm); clearTimeout(hold);
        el.onpointerdown = el.onpointerup = el.onpointercancel = null;
        gsap.killTweensOf('#rv-bar');
        gsap.to(el, { yPercent: 140, duration: .4, ease: 'power3.in', onComplete: () => el.classList.remove('on', 'held') });
        res();
      };
      const tm = setTimeout(finish, dur);
      const freeze = () => { clearTimeout(tm); gsap.getTweensOf('#rv-bar').forEach(t => t.pause()); el.classList.add('held'); };

  if (WORD_RULE[c] && /很|也|都|不|吗|呢/.test(c)) return WORD_RULE[c];
  if (expected === seq[0]) {
    if (expected === '好' && seq.length > 1) return `好 («vale») abre la frase, seguido de coma; después va quién: ${seq[1]}`;
    const OWN = { '我': 'mi', '你': 'tu' }, N = OWN[expected] && ['爸爸', '妈妈', '男朋友'].includes(seq[1]) && vocabOf(seq[1]);
    if (N) return `Primero va de quién se habla: ${expected}${seq[1]} = ${OWN[expected]} ${lowerFirst(N.espanol)}`;
    if (/^[我你他她]们?$/.test(expected)) return 'Primero va quién (el sujeto)';

  if (audio) {
    UI.prompt({ seal: '句', chip: 'Ordena la frase', title: '¿Qué has oído?', long: true, sub: 'Ordena las fichas · toca el altavoz para repetir', speaker: true });

  ripple(e.clientX, e.clientY); touchTilt = e.pointerType !== 'mouse';
  pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = -(e.clientY / innerHeight * 2 - 1);
  if (state.skip) { state.skip(); return; }
  if (state.locked || !round || round.exiting) return;
  ndc.set(pointer.x, pointer.y); raycaster.setFromCamera(ndc, camera);
  for (const hit of raycaster.intersectObjects(round.pick, true)) {
    let o = hit.object; while (o && !o.userData.onTap) o = o.parent;
    if (o) { o.userData.onTap(); break; }
  }
});
window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = -(e.clientY / innerHeight * 2 - 1); } });
window.addEventListener('deviceorientation', e => {
  if (e.gamma == null) return; lastOrient = performance.now();
  pointer.x = THREE.MathUtils.clamp(e.gamma / 30, -1, 1); pointer.y = THREE.MathUtils.clamp((e.beta - 45) / 30, -1, 1);
});
// Toque: repetir. Mantener pulsado medio segundo: repetir despacio
function holdToSlow(el, onTap) {
  let tm = null, held = false;
  el.addEventListener('pointerdown', e => {
    e.stopPropagation(); held = false; clearTimeout(tm);
    tm = setTimeout(() => {
      held = true; if (!round || round.exiting || !round.speakText) return;
      sfx.tap(); Speech.say(round.speakText, Math.max(.42, (round.speakRate || .78) * .6));
      gsap.fromTo(el, { scale: .86 }, { scale: 1, duration: .5, ease: 'back.out(3)', clearProps: 'transform' });
    }, 450);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, () => clearTimeout(tm)));
  el.addEventListener('click', e => { e.stopPropagation(); if (held) { held = false; return; } if (round && !round.exiting) onTap(); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdToSlow($('#speak'), () => {
  if (round.mode === 'orbit') round.group.children[0].userData.onTap();
  else if (round.speakText) { sfx.tap(); Speech.say(round.speakText, round.speakRate); }
});

// Selector de temas
function paintTopicBtn() { $('#topic-seal').textContent = TOPICS[topicKey].seal; $('#topic-name').textContent = TOPICS[topicKey].name; }
function openTopics(open) {
  const el = $('#topics');
  if (open) {
    $('#topic-list').innerHTML = Object.entries(TOPICS).map(([k, t]) =>
      `<button class="topic${k === topicKey ? ' on' : ''}" data-k="${k}"><span class="seal">${t.seal}</span><div><b>${t.name}</b><span>${t.desc}</span></div></button>`).join('');
    el.classList.add('on');
    gsap.fromTo('#topics .sheet', { yPercent: 110 }, { yPercent: 0, duration: .5, ease: 'expo.out' });
    gsap.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .25 });
  } else gsap.to('#topics .sheet', { yPercent: 110, duration: .3, ease: 'power3.in', onComplete: () => el.classList.remove('on') });
}
function setTopic(k) {
  openTopics(false);
  if (k === topicKey) return;
  topicKey = k; paintTopicBtn(); lastMode = null; recent.length = 0; recentP.length = 0;
  try { localStorage.setItem('topic', k); } catch (e) {}
  if (!round || round.exiting) return;
  const R = round;
  transitionOut().then(() => { if (round === R) startRound(); });
  if (state.skip) state.skip();   // cierra la tarjeta de respuesta si estaba abierta
}
$('#topic-btn').addEventListener('click', e => { e.stopPropagation(); sfx.tap(); openTopics(true); });
$('#topics').addEventListener('click', e => {
  const b = e.target.closest('.topic');
  if (b) setTopic(b.dataset.k); else if (e.target.id === 'topics') openTopics(false);
});
paintTopicBtn();

function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = aspect;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  view.dist = THREE.MathUtils.clamp(4.7 / (2 * tanH * aspect), 9, 16);
  camera.position.set(0, 0, view.dist); camera.updateProjectionMatrix();
  view.h = 2 * tanH * view.dist; view.w = view.h * aspect;
  bgMat.uniforms.uAspect.value = aspect;
  U.ptScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y * .5 / tanH;
  layoutDecor();
  if (round && !round.exiting) round.layout();
}
window.addEventListener('resize', () => { _safeB = null; resize(); });
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
// Si iOS pierde y devuelve el contexto WebGL (p. ej. tras mucho rato en segundo plano), three rehace programas y buffers,
// pero las texturas ya no tienen lienzo: se redibujan y suben de una en una. También se rehace el entorno (reflejos del oro).
canvas.addEventListener('webglcontextrestored', () => {
  buildEnv();
  const all = [...texCache.values()].map(e => e.t);
  if (decor.mMat) all.push(decor.mMat.map);
  for (const t of all) { t.userData.redraw(); renderer.initTexture(t); }
});

// La insignia HTML sigue a la moneda 3D, sobre su borde inferior derecho
const _tagV = new THREE.Vector3(), tagEl = $('#coin-tag');
function placeCoinTag() {
  const c = round.coin; c.getWorldPosition(_tagV); _tagV.x += c.scale.x * .72; _tagV.y -= c.scale.y * .72; _tagV.project(camera);
  tagEl.style.left = (_tagV.x + 1) / 2 * innerWidth + 'px'; tagEl.style.top = (1 - _tagV.y) / 2 * innerHeight + 'px';
}
holdToSlow(tagEl, () => { if (round.coin) round.coin.userData.onTap(); });
// Rendimiento: ?perf muestra FPS, ms por fotograma, draw calls y triángulos.
// __bench(n, pr) mide n renders seguidos a la resolución pr (2-3 = iPhone), esperando a la GPU.
const PERF = new URLSearchParams(location.search).has('perf');
const perf = { el: null, acc: 0, n: 0, last: performance.now(), worst: 0, mode: null, log: [] };
if (PERF) {
  perf.el = document.createElement('div');
  perf.el.style.cssText = 'position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:30;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#9f9;font:600 11px ui-monospace,Menlo,monospace;pointer-events:none;white-space:pre';
  document.body.appendChild(perf.el);
  renderer.info.autoReset = false;   // el composer hace varios render(): se cuenta el fotograma entero
  window.__dbg = { get round() { return round; }, glowFace, gsap, THREE, renderer, composer, bloom, outPass, texCache };
  document.addEventListener('visibilitychange', () => { perf.last = performance.now(); });   // volver de segundo plano no es un tirón
  // A/B: el mismo fotograma con dos configuraciones → diferencia máxima por canal (0-255) y % de canales distintos
  window.__ab = (setA, setB) => {
    const grab = set => {
      set(); composer.render();
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
      const g = c.getContext('2d'); g.drawImage(canvas, 0, 0);
      return g.getImageData(0, 0, c.width, c.height).data;
    };
    const a = grab(setA), b = grab(setB);
    let max = 0, n = 0;
    for (let i = 0; i < a.length; i++) { const d = Math.abs(a[i] - b[i]); if (d) { n++; if (d > max) max = d; } }
    return { max, pct: +(100 * n / a.length).toFixed(3) };
  };
  if (bloom.fused) {   // A: mezcla antigua del bloom sobre la escena · B: suma en el OutputPass
    const BLACK = new THREE.DataTexture(new Uint8Array(4), 1, 1); BLACK.needsUpdate = true;
    const tb = outPass.uniforms.tBloom, real = tb.value;
    window.__dbg.bloomAB = () => window.__ab(
      () => { bloom.fsQuad.render = bloom.fused.draw; tb.value = BLACK; },
      () => { bloom.fsQuad.render = bloom.fused.skip; tb.value = real; });
  }
  window.__bench = (n = 60, pr = renderer.getPixelRatio()) => {
    const old = renderer.getPixelRatio(), gl = renderer.getContext(), px = new Uint8Array(4);
    const setPR = p => { renderer.setPixelRatio(p); composer.setPixelRatio(p); composer.setSize(innerWidth, innerHeight); };
    setPR(pr);
    const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    for (let i = 0; i < 5; i++) composer.render(); sync();
    renderer.info.reset();
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { updateDecor(i / 60, 1 / 60); sparks.update(1 / 60); composer.render(); }
    sync();
    const ms = (performance.now() - t0) / n;
    const info = { ms: +ms.toFixed(2), calls: Math.round(renderer.info.render.calls / n), tris: Math.round(renderer.info.render.triangles / n), programs: renderer.info.programs.length, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries };
    setPR(old);
    return info;
  };
}
// ?perf: al empezar cada ronda se apunta el peor fotograma de la anterior (los tirones no se ven en la media)
function perfRound(k) {
  if (perf.mode) {
    const s = `${perf.mode} ${perf.worst.toFixed(0)} ms · ${renderer.info.programs.length} prog · ${renderer.info.memory.textures} tex`;
    perf.log.unshift(s); if (perf.log.length > 5) perf.log.length = 5;
    console.log('[tirón]', s);
  }
  perf.mode = k; perf.worst = 0;
}
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  if (PERF) {
    const now = performance.now(), d = now - perf.last; perf.acc += d; perf.last = now; perf.n++;
    if (d > perf.worst) perf.worst = d;
    if (perf.acc > 500) {
      perf.el.textContent = `${Math.round(1000 * perf.n / perf.acc)} fps · ${(perf.acc / perf.n).toFixed(1)} ms · ${renderer.info.render.calls} dc · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tri · pr ${renderer.getPixelRatio()}` + (perf.log.length ? '\n' + perf.log.join('\n') : '');
      perf.acc = perf.n = 0;
    }
  }
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
  U.time.value = t; bgMat.uniforms.uTime.value = t;
  const k = Math.min(1, dt * 2.5);
  if (touchTilt && performance.now() - lastOrient > 1000) { const d = Math.max(0, 1 - dt * 1.2); pointer.x *= d; pointer.y *= d; }
  world.rotation.y += (pointer.x * .12 - world.rotation.y) * k;
  world.rotation.x += (-pointer.y * .07 - world.rotation.x) * k;
  if (round && !round.exiting) round.update(t, dt);
  if (round && round.coin && !round.exiting) placeCoinTag();
  updateDecor(t, dt);
  sparks.update(dt);
  if (PERF) renderer.info.reset();
  composer.render();
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function loadFonts() {
  const zh = VOCAB.map(v => v.chino).join('') + Object.values(PHRASES).map(P => P.zh).join('') + '福对很好太棒了真汉字音数听拼对话义配全页哥弟开始复句写！？，。、';
  const py = VOCAB.map(v => v.pinyin).join('') + 'āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü0123456789';
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`900 64px "Noto Serif SC"`, zh), document.fonts.load(`700 64px "Noto Serif SC"`, zh),
        document.fonts.load(`700 64px "Noto Serif"`, py), document.fonts.load(`600 16px Inter`, 'Aa'),
      ]),
      sleep(4000),
    ]);
  } catch (e) {}
}
(async () => {
  await loadFonts();
  buildDecor();
  resize();
  frame();
  // Precalienta los shaders con las MISMAS claves que usa el RenderPass (destino = RT del composer, sin tone mapping).
  // Los materiales de muestra no se liberan a propósito: así three no destruye (ni luego recompila en plena ronda)
  // los programas de la cara de ficha/placa/carta, la cara de la moneda y la onda de acierto.
  const warm = { disposables: [] };
  const ringWarm = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });   // misma clave que shockwave()
  const tmp = [makeTile('一', warm), makeLantern('yī', warm), makeSkyLantern('一', warm), makeCoin('一', warm), new THREE.Mesh(ringGeo, ringWarm)];
  tmp.forEach(o => { o.position.z = -50; scene.add(o); });
  renderer.setRenderTarget(composer.readBuffer);
  renderer.compile(scene, camera);
  renderer.setRenderTarget(null);
  // Un dibujo real, tapado por el loader (opaco): Metal crea aquí los pipelines y se suben las texturas de muestra,
  // en vez de hacerlo en el primer fotograma de la primera ronda
  tmp.forEach((o, i) => { o.position.set((i - 2) * .4, 0, 0); o.scale.setScalar(.1); });
  composer.render();
  tmp.forEach(o => scene.remove(o));
  rig.rotation.set(rand(-.1, .05), (Math.random() < .5 ? -1 : 1) * .32, 0); rig.position.z = 3;
  // Sello 开始: ese primer toque desbloquea la voz y los sonidos (listener global en captura), así la 1.ª ronda ya puede ser de escucha
  const L = $('#loader'), seal = L.querySelector('.seal');
  seal.textContent = '开始'; L.querySelector('p').textContent = 'Toca para empezar'; L.classList.add('ready');
  gsap.fromTo(seal, { scale: .6, rotate: -8 }, { scale: 1, rotate: 0, duration: .7, ease: 'back.out(2.4)' });
  await new Promise(res => L.addEventListener('pointerup', e => { ripple(e.clientX, e.clientY); res(); }, { once: true }));
  sfx.place();
  gsap.to(seal, { scale: 1.25, duration: .35, ease: 'back.in(2)' });
  gsap.to(L, { opacity: 0, duration: .55, delay: .15, ease: 'power2.out', onComplete: () => L.remove() });
  startRound();
  if (!round.speakText) Speech.say('你好！', .85);   // si la ronda habla, el saludo la cortaría
  // Precarga de texturas en ratos quietos (Safari no tiene requestIdleCallback): una cada 400 ms, solo con la ronda quieta
  // (>1,2 s desde que empezó, sin bloquear, sin toques recientes) y solo lo que el tema puede usar, con las mismas claves
  // que las rondas: primero los teclados (12 fichas de golpe), luego las fichas de frases y por último el vocabulario.
  let lastInput = 0;
  window.addEventListener('pointerdown', () => { lastInput = performance.now(); }, { capture: true, passive: true });
  const warmList = () => {
    const ms = TOPICS[topicKey].modes || Object.keys(MODES), has = m => ms.includes(m), L = new Map();
    const add = (key, make) => { if (!texCache.has(key)) L.set(key, make); };
    const tile = (c, py = '') => add('tile:' + c + '|' + py, () => tileFaceTex(c, py));
    if (['numbers', 'page', 'dictation'].some(has)) [...NUMS, ZERO, BAI, DI, YE].forEach(v => tile(v.chino, v.pinyin));
    if (has('order') || has('dialog')) {
      topicPhrases().forEach(P => orderWords(P).forEach(x => tile(x.c, x.p.toLowerCase())));
      [...ORDER_TRAPS, ...Object.values(BLANK_WRONG).flat()].forEach(c => { const py = pyOf(c); if (py) tile(c, py); });
    }
    if (['tiles', 'pyChar', 'meaning'].some(has)) vocabPool().forEach(v => tile(v.chino));
    if (has('listen') && Speech.ok && !Speech.knownNoZh()) vocabPool().forEach(v => add('ink:' + v.chino, () => inkTex(v.chino)));
    if (has('orbit')) vocabPool().forEach(v => add('py:' + v.pinyin, () => labelTex(v.pinyin)));
    return [...L.values()];
  };
  let warmQ = warmList(), warmTopic = topicKey, seenR = null, seenAt = 0;
  const pump = () => {
    const now = performance.now();
    if (topicKey !== warmTopic) { warmTopic = topicKey; warmQ = warmList(); }
    if (round !== seenR) { seenR = round; seenAt = now; }
    if (warmQ.length && !document.hidden && !state.locked && round && !round.exiting && now - seenAt > 1200 && now - lastInput > 1200)
      renderer.initTexture(warmQ.shift()());
    setTimeout(pump, warmQ.length ? 400 : 2000);
  };
  setTimeout(pump, 2500);
})();
</script>
